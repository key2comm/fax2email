    # The fax2email portal. Included in the HTTP server (and the HTTPS server
    # once HTTPS is on) by write_nginx_config in scripts/lib.sh, which fills in
    # the PHP-FPM socket. Only public/ is served, so .env, storage/ and the
    # code are never reachable.

    root /var/www/html/fax2email/public;
    index index.php;

    charset utf-8;
    # Matches PHP's post_max_size (see configure_php_limits in install.sh).
    client_max_body_size 60m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_FPM_SOCKET__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        __FASTCGI_HTTPS__
        fastcgi_hide_header X-Powered-By;
    }

    # Hidden files are never served, except Let's Encrypt's challenge files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
