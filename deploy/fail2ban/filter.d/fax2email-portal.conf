# Failed logins on the fax2email web portal, which the app writes to the
# system journal as "Failed portal login from <IP> for <email>".
# Installed to /etc/fail2ban/filter.d/fax2email-portal.conf.

[INCLUDES]
before = common.conf

[Definition]
_daemon = fax2email-auth
failregex = ^%(__prefix_line)sFailed portal login from <HOST> for 
ignoreregex =
journalmatch = SYSLOG_IDENTIFIER=fax2email-auth
