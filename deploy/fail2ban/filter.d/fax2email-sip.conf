# Failed SIP registrations/calls and unknown users on FreeSWITCH.
# Extends fail2ban's own freeswitch filter: FreeSWITCH 1.10 writes the CPU idle
# percentage after the timestamp ("... 20:00:01.123456 95.97% [WARNING] ..."),
# which the stock filter does not expect, so those attempts would be missed.
# "normal" mode only counts real failures, not the auth challenge every
# legitimate phone receives before it registers.
# Installed to /etc/fail2ban/filter.d/fax2email-sip.conf.

[INCLUDES]
before = freeswitch.conf

[Definition]
_pref_line = ^%(__prefix_line)s(?:(?:\d+-)?\d+-\d+ \d+:\d+:\d+\.\d+)?(?: +\d+(?:\.\d+)?%%)?
mode = normal
