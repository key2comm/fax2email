# fail2ban action that adds banned addresses to fax2email's nftables sets.
# Each jail has its own set (<name>_inet4 / <name>_inet6), so when a short ban
# ends it cannot lift a longer repeat-offender ban on the same address.
# Installed to /etc/fail2ban/action.d/fax2email.conf.

[Definition]

actionstart = nft list table inet fax2email >/dev/null 2>&1 || nft -f /usr/local/lib/fax2email/fax2email.nft

actionstop =

actioncheck =

# Re-adding replaces the timeout, e.g. when a repeat offender's ban is extended.
actionban = nft delete element inet fax2email <name>_<family> '{ <ip> }' 2>/dev/null; nft add element inet fax2email <name>_<family> '{ <ip> timeout <bantime>s }'

actionunban = nft delete element inet fax2email <name>_<family> '{ <ip> }' 2>/dev/null || true
