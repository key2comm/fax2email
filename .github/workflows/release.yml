name: release

# Push a tag like v0.2.0 (see scripts/release.sh) to build a release that
# installed servers can pick up with `sudo fax2email-update`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag v$tag does not match VERSION file ($file)"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip, bcmath, gd

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run tests
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          php artisan test

      - name: Build release archive
        run: |
          set -euo pipefail
          name="fax2email-${GITHUB_REF_NAME}"
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          rm -f .env
          mkdir -p "dist/$name"
          # Ship everything a server needs to run, including vendor/ and the built
          # frontend, so servers never need Composer or Node to install or update.
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='dist' --exclude='node_modules' \
            --exclude='tests' --exclude='storage/logs/*' --exclude='storage/framework/*/*' \
            --exclude='bootstrap/cache/*.php' --exclude='.phpunit.cache' \
            ./ "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/fax2email-${GITHUB_REF_NAME}.tar.gz" \
            "dist/fax2email-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
